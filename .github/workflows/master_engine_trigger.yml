name: "👑 Sovereign Master Engine Mega-Core Pipeline"

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable verbose debugging for Sovereign Engine'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: sovereign-master-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_master_engine:
    name: "🚀 تنفيذ المحرك السيادي الشامل بمعايير العمالقة العالمية"
    runs-on: self-hosted
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: 🛡️ Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Verify System Python & Pip
        run: |
          echo "=== 🛡️ System Core Diagnostics ==="
          python3 --version
          python3 -m pip --version

      - name: 📦 Install Enterprise Core Dependencies & Libraries
        run: |
          echo "=== 📦 Loading Mega-Core Libraries ==="
          # 1. تثبيت الحزم المرنة والأساسية أولاً لضمان عدم تعطل المحرك
          python3 -m pip install --prefer-binary fastapi pydantic uvicorn httpx sqlalchemy --break-system-packages
          echo "✅ Core Dependencies Installed Successfully."
          
          # 2. عزل مكتبة ccxt لتفادي انهيار البناء المعماري (C-extensions) على Termux
          echo "📦 Attempting to load ccxt (Heavy Crypto Library)..."
          python3 -m pip install ccxt --break-system-packages || echo "⚠️ [Architecture Warning]: تم تخطي تثبيت ccxt مؤقتاً لتجنب تعارضات البناء على الهاتف. المحرك سيستمر في العمل."

      - name: 🧭 Pre-Flight Workspace Diagnostic & Path Resolution
        run: |
          echo "=== 🧭 Sovereign Workspace Diagnostics ==="
          pwd
          ls -la
          # الطريقة الصحيحة والموثوقة لتمرير المتغيرات في GitHub Actions
          echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
          echo "✅ PYTHONPATH dynamically mapped to: $PWD"

      - name: ⚙️ Execute Sovereign Master Engine (Mega-Core v17.0)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # تفعيل خاصية التوقف الفوري مع اقتناص الأخطاء لتشخيص أسرع
          set -e
          trap 'echo "❌ [System Failure]: حدث انهيار غير متوقع أثناء تشغيل المحرك السيادي."' ERR

          echo "==================================================="
          echo "👑 Starting Sovereign Master Engine Execution..."
          echo "==================================================="
          
          # مسح وتحديد المسار الديناميكي بمرونة فائقة لتفادي أي أخطاء مفقودة
          if [ -f "./scripts/sovereign_master_engine.py" ]; then
            echo "✅ [Routing]: Executing from standard ./scripts/ path..."
            python3 ./scripts/sovereign_master_engine.py
          elif [ -f "./python_scripts/sovereign_master_engine.py" ]; then
            echo "✅ [Routing]: Executing from ./python_scripts/ path..."
            python3 "./python_scripts/sovereign_master_engine.py"
          else
            echo "⚠️ [Routing]: Standard paths missed. Searching dynamically for Sovereign Engine..."
            # بحث ذكي يستثني المجلدات المخفية (مثل .git) لتسريع العملية
            ENGINE_PATH=$(find . -not -path '*/\.*' -name "sovereign_master_engine.py" | head -n 1)
            if [ -n "$ENGINE_PATH" ]; then
              echo "🎯 [Routing]: Engine perfectly located at -> $ENGINE_PATH"
              python3 "$ENGINE_PATH"
            else
              echo "❌ [Critical Error]: Sovereign Master Engine script could not be located anywhere in the workspace!"
              exit 1
            fi
          fi
          echo "✅ [Execution Completed]: Sovereign Master Engine finished its cycle flawlessly."

      - name: 🚀 Commit & Push Synchronized Architecture Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "👑 Sovereign Master Engine: إتمام التدقيق، الإصلاح المعماري، والربط المؤسسي بنجاح تام"
          branch: ${{ github.head_ref || github.ref_name }}
          
