name: 👑 Sovereign Master Engine Trigger

on:
  workflow_dispatch:

jobs:
  run_master_engine:
    name: 🚀 تشغيل المحرك السيادي الشامل وإصلاح الأخطاء
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Enterprise Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: pip install fastapi pydantic uvicorn httpx ccxt sqlalchemy

      - name: Execute Sovereign Master Engine
        run: |
          python "$GITHUB_WORKSPACE/scripts/sovereign_master_engine.py"
  
          python ./scripts/sovereign_master_engine.py

      - name: Commit & Push Fixed Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "👑 Sovereign Master Engine: تم تشغيل الزر الشامل وإصلاح وربط النظام بنجاح"
          branch: main
