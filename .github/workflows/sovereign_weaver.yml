name: 🧬 Sovereign Weaver & Auto-Stitching Engine

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'المسار المستهدف (مثل: mobile_empire_app/lib/main.dart)'
        required: true
      code_snippet:
        description: 'القطعة البرمجية أو الدالة المراد حقنها'
        required: true
      snippet_type:
        description: 'نوع القطعة (widget, import, init, py_import, py_route)'
        required: true
        default: 'widget'

jobs:
  weave-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 سحب ملفات المشروع
        uses: actions/checkout@v4

      - name: ⚙️ تهيئة بيئة بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🚀 تشغيل محرك الخياطة السيادي
        env:
          TARGET_FILE: ${{ github.event.inputs.target_file }}
          CODE_SNIPPET: ${{ github.event.inputs.code_snippet }}
          SNIPPET_TYPE: ${{ github.event.inputs.snippet_type }}
        run: |
          python3 sovereign_weaver_core.py

      - name: 💾 حفظ ورفع التعديلات تلقائياً
        run: |
          git config --global user.name "Sovereign-Weaver-Bot"
          git config --global user.email "weaver@aymnguard.core"
          git add .
          git commit -m "⚡ Weaver: تم الحقن الآلي بنجاح في ${{ github.event.inputs.target_file }}" || echo "لا توجد تعديلات للحفظ"
          git push
