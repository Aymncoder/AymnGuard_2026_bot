name: Deploy to Production Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Executing Remote Server Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 1. الدخول إلى مجلد المشروع
            cd /root/AymnGuard_2026_bot
            
            # 2. سحب أحدث التعديلات من جيتهاب
                        # سحب أحدث التعديلات وفرضها على السيرفر مع تنظيف الملفات المؤقتة المعيقة
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            
            # 3. إيقاف أي نسخة سابقة تعمل من البوت لتجنب تداخل العمليات
            pkill -f "python3 run.py" || true
            pkill -f "python3 main.py" || true
            pkill -f "python run.py" || true
            pkill -f "python main.py" || true
            
            # 4. تشغيل البوت في الخلفية (تم اعتماد run.py كملف تشغيل أساسي)
            # إذا كان ملفك الأساسي هو main.py، فقط قم بتغيير الكلمة في السطر السفلي
            nohup python3 run.py > /dev/null 2>&1 &
