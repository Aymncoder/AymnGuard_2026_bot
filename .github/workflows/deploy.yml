          script: |
            # 1. الدخول إلى مجلد المشروع
            cd /root/AymnGuard_2026_bot
            
            # 2. سحب أحدث التعديلات بالقوة
            git fetch --all
            git reset --hard origin/main
            git clean -fd
            
            # 3. إيقاف أي نسخة سابقة للبوت لمنع تداخل العمليات
            pkill -f "python" || true
            
            # 4. تشغيل البوت في الخلفية مع فصله تماماً عن جلسة SSH (هنا التعديل الجديد)
            nohup python3 run.py </dev/null>/dev/null 2>&1 &
            
            # 5. إنهاء الاتصال بنجاح
            sleep 2
