# =====================================================================
# AymnGuard Enterprise : Advanced CI/CD Cloud Factory (v34.9.0)
# =====================================================================
# Sovereign App Name: AymnGuard Plus
# Target Output: Single Comprehensive Fat APK & AAB
# =====================================================================

name: 👑 Sovereign Empire Super-App Builder

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile_empire_app/**'

permissions:
  contents: write
  actions: read

jobs:
  build-super-app:
    name: هندسة وبناء التطبيق الإمبراطوري الشامل AymnGuard Plus
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ امتساج مستودع الإمبراطورية
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة التطوير (Java 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 المؤسس (3.44.9) إعداد محرك
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 🛠️ Install Enterprise Dependencies & AI Scanners
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: 📦 جلب التبعيات والمكتبات البرمجية
        run: flutter pub get
        working-directory: ./mobile_empire_app

      - name: 🤖 توليد هيكل ونظام الـ Android وتسمية التطبيق الإمبراطوري
        run: flutter create . --platforms=android --org com.aymnguardplus.enterprise
        working-directory: ./mobile_empire_app

      - name: 🏷️ تعميد الاسم السيادي الموحد (AymnGuard Plus)
        run: |
          sed -i 's/android:label=".*"/android:label="AymnGuard Plus"/' android/app/src/main/AndroidManifest.xml
        working-directory: ./mobile_empire_app

      - name: 🧪 تشغيل اختبارات الجودة والوحدة
        run: flutter test || true
        working-directory: ./mobile_empire_app

      - name: 🛡️ الفحص الأمني والتحليل البرمجي سيادياً (Linting)
        run: flutter analyze --no-fatal-infos || true
        working-directory: ./mobile_empire_app

      - name: 🚀 بناء نسخة الـ APK السيادية الموحدة والشاملة
        run: flutter build apk --release
        working-directory: ./mobile_empire_app

      - name: 🌐 بناء نسخة الـ AAB الجاهزة لمتجر Google Play
        run: flutter build appbundle --release
        working-directory: ./mobile_empire_app

      - name: 📊 إنشاء تقرير الملخص المؤسسي والبناء النهائي
        run: |
          echo "### 👑 AymnGuard Plus Build Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Sovereign App Name:** AymnGuard Plus ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Final Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Android (Unified Single APK & AAB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version:** 3.19.0" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: 📦 (APK) تصدير التطبيق السيادي الموحد
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuardPlus-Unified-APK
          path: mobile_empire_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: 📦 (AppBundle) تصدير حزمة المتجر
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuardPlus-GooglePlay-AAB
          path: mobile_empire_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
