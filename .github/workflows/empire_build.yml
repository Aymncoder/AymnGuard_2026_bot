# =====================================================================
# AymnGuard Enterprise : Advanced CI/CD Cloud Factory (v18.1.0)
# =====================================================================
# (Super Apps) مصدر البناء المؤسسي المتقدم: تم تصميمه للتعامل مع التطبيقات الفائقة
# والتحليل الأمني والتدمير المزدوج (Caching). يحتوي على تقنيات للبناء السريع (APK & AAB)

name: 👑 Sovereign Empire Super-App Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_empire_app/**'

jobs:
  build-super-app:
    name: هندسة وبناء التطبيق الإمبراطوري الشامل
    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ امتساج مستودع الإمبراطورية
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة التطوير
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦋 إعداد محرك Flutter المؤسسي
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: 🛠️ Install Enterprise Dependencies & AI Scanners
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          # أضف حزم بايثون أو متطلبات الفحص الأمني هنا عند الحاجة
          # pip install -r requirements.txt

      - name: 📦 جلب التبعيات والمكتبات البرمجية
        run: flutter pub get
        working-directory: ./mobile_empire_app

      - name: 🧪 تشغيل اختبارات الجودة والوحدة
        run: flutter test
        working-directory: ./mobile_empire_app
        continue-on-error: true

      - name: 🛡️ الفحص الأمني والتحليل البرمجي (Linting)
        run: flutter analyze
        working-directory: ./mobile_empire_app
        continue-on-error: true

      - name: 🚀 بناء نسخة الـ APK (للتثبيت المباشر على هاتفك)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi
        working-directory: ./mobile_empire_app

      - name: 🌐 بناء نسخة الـ AAB الجاهزة لمتجر (Google Play)
        run: flutter build appbundle --release
        working-directory: ./mobile_empire_app

      - name: 📊 إنشاء تقرير الملخص المؤسسي والبناء
        run: |
          echo "### 🚀 AymnGuard Build Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Android (APK & AAB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version:** 3.19.0" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: 📦 (APK) تصدير التطبيق الجاهز
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuard-SuperApp-APK
          path: mobile_empire_app/build/app/outputs/apk/release/app-*.apk
          retention-days: 7

      - name: 📦 (AppBundle) تصدير حزمة المتجر
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuard-SuperApp-GooglePlay-AAB
          path: mobile_empire_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
