# ==============================================================================
# AymnGuard Enterprise : Advanced CI/CD Cloud Factory (v18.0.0)
# ==============================================================================
# مصنع البناء المؤسسي المتقدم: تم تصميمه للتعامل مع التطبيقات الفائقة (Super Apps)
# يحتوي على تقنيات تسريع البناء (Caching)، التحليل الأمني، والتصدير المزدوج (APK & AAB).

name: 👑 Sovereign Empire Super-App Builder

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'mobile_empire_app/**' 

jobs:
  build-super-app:
    name: 🏗️ هندسة وبناء التطبيق الإمبراطوري الشامل
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ مستودع الإمبراطورية
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة التطوير (Java 17 Zulu)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦋 إعداد محرك Flutter المؤسسي
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true # تفعيل الذاكرة المؤقتة لتسريع عمليات البناء القادمة

      - name: 📦 جلب التبعيات والمكتبات البرمجية
        run: flutter pub get
        working-directory: ./mobile_empire_app

      - name: 🛡️ الفحص الأمني والتحليل البرمجي (Linting)
        run: flutter analyze
        working-directory: ./mobile_empire_app
        continue-on-error: true # يستمر البناء حتى لو ظهرت تحذيرات برمجية

      - name: 🛠️ بناء نسخة الـ APK (للتثبيت المباشر على هاتفك)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi
        working-directory: ./mobile_empire_app

      - name: 🌍 بناء نسخة الـ AAB (الجاهزة لمتجر Google Play)
        run: flutter build appbundle --release
        working-directory: ./mobile_empire_app

      - name: 🚀 تصدير التطبيق الجاهز (APK)
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuard-SuperApp-APK
          path: mobile_empire_app/build/app/outputs/apk/release/app-*.apk
          retention-days: 7

      - name: 📦 تصدير حزمة المتجر (AppBundle)
        uses: actions/upload-artifact@v4
        with:
          name: AymnGuard-SuperApp-GooglePlay-AAB
          path: mobile_empire_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
