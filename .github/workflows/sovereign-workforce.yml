name: 🌐 AymnGuard Sovereign Digital Workforce

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

# 🛡️ تصريح سيادي: السماح للعمالة الرقمية بإجراء تعديلات وإصلاحات مباشرة على الكود
permissions:
  contents: write

jobs:
  Hyper_Static_Analysis_And_Healing:
    name: 🔍 التحليل والإصلاح الذاتي (Auto-Healing & Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ضروري لتمكين رفع التعديلات (Push)

      - name: Set up Enterprise Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Auto-Healing Workforce
        run: pip install ruff black

      - name: Execute Sovereign Formatting (Auto-Fix)
        # تمت إزالة --check لتقوم الأداة بإصلاح الملفات الـ 97 فعلياً
        run: black .

      - name: Execute Lightning-Fast Linting (Ruff Auto-Fix)
        # إضافة --fix ليقوم Ruff بإصلاح الأخطاء الهيكلية تلقائياً (مثل المكاتب غير المستخدمة)
        run: ruff check . --fix

      - name: Commit & Push Formatted Code (Self-Healing)
        # 🤖 وكيل الإصلاح الذاتي: يقوم بحفظ التعديلات ورفعها إلى المستودع دون تدخل بشري
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-Healing: تم تنسيق وإصلاح الكود برمجياً (Black & Ruff)"
          branch: ${{ github.head_ref || github.ref_name }}

  Security_Payload_Scan:
    name: 🛡️ الفحص الأمني الاستباقي (SAST)
    runs-on: ubuntu-latest
    needs: Hyper_Static_Analysis_And_Healing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install Security Scanners (Bandit & Semgrep)
        run: pip install bandit semgrep
      
      - name: Scan for Hardcoded API Keys & Injections
        run: bandit -r core/ services/ database/ -lll

      - name: Deep Vulnerability Scan (Semgrep)
        run: semgrep --config auto .

  Smart_Contract_Audit:
    name: 📜 تدقيق العقود الذكية (Solidity Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for Smart Contracts
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Slither (Solidity ^0.8.34 Analyzer)
        run: pip3 install slither-analyzer
      - name: Audit Token Contracts & Marketing Wallets
        run: |
          if [ -d "contracts" ]; then
            slither contracts/ --exclude-dependencies
          else
            echo "لا توجد عقود ذكية حالياً للتدقيق."
          fi

  Cognitive_AI_Review:
    name: 🧠 المراجعة الإدراكية للمنطق المالي (Enterprise Core)
    runs-on: ubuntu-latest
    needs: [Security_Payload_Scan, Smart_Contract_Audit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Enterprise Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install System Dependencies
        run: pip install httpx asyncio

      - name: Deploy Sovereign AI Auditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/enterprise_cognitive_auditor.py

  Dynamic_Execution_Sandboxing:
    name: ⚡ بيئة المحاكاة وفحص تدفق البيانات (Binance Spot/Futures)
    runs-on: ubuntu-latest
    needs: Cognitive_AI_Review
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install Execution Dependencies
        run: pip install pytest pytest-asyncio pydantic ccxt httpx sqlalchemy
      
      - name: Run Core Logic Simulation (Mocked APIs)
        run: pytest tests/ --maxfail=1 --disable-warnings -q
