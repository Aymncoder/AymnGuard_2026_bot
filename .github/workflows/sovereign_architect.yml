# ==============================================================================
# AymnGuard Sovereign Enterprise : Autonomous Architect CI/CD Pipeline
# ==============================================================================
name: 👑 Sovereign Architect & Integrity Agent

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write  # منح الصلاحية الكاملة للأداة لتعديل ورفع الملفات للمستودع

jobs:
  sovereign-audit:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب أحدث نسخة من المستودع
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة بايثون
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # 3. تثبيت التبعيات
      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. إطلاق المهندس السيادي الآلي (التعديل والمحاكاة)
      - name: Run Sovereign Architect Audit Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/sovereign_architect_bot.py

      # 5. الحفظ والرفع التلقائي (Auto-Commit & Push) للتعويض والربط
      - name: Auto-Commit & Push Sovereign Changes
        run: |
          git config --global user.name "Sovereign Architect Bot"
          git config --global user.email "architect@sovereign.bot"
          git add .
          git diff --staged --quiet || git commit -m "👑 [Sovereign Auto-Patch]: Autonomous wiring, dependency sync and ecosystem update"
          git push
