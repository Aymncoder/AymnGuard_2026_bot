# ==============================================================================
# AymnGuard Sovereign Enterprise : Autonomous Architect CI/CD Pipeline v34.1
# ==============================================================================
name: 👑 Sovereign Supreme Architect & AI Swarm Resilient Factory

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sovereign-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install google-genai sqlalchemy aiosqlite pydantic fastapi uvicorn

      - name: Run Sovereign Resilient AI Swarm Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        run: |
          python scripts/sovereign_architect_bot.py

      - name: Auto-Commit & Push Sovereign State & Resilient Changes
        run: |
          git config --global user.name "Sovereign Resilient Architect"
          git config --global user.email "resilient@sovereign.bot"
          CURRENT_BRANCH=$(git branch --show-current)
          git add .
          git commit -m "👑 [Sovereign Resilient v34.1]: Auto-recovery and multi-model intent execution sync" || true
          git pull origin $CURRENT_BRANCH --rebase --autostash || true
          git push origin $CURRENT_BRANCH
