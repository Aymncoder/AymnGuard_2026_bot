# ==============================================================================
# AymnGuard Sovereign Enterprise : Autonomous Architect CI/CD Pipeline v34.3
# ==============================================================================
name: 👑 Sovereign Supreme Architect & Key Health Validated Factory v34.3

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sovereign-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install google-genai sqlalchemy aiosqlite pydantic fastapi uvicorn

      - name: Run Sovereign Validated Key Swarm Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          GEMINI_API_KEY_PROJECT2: ${{ secrets.GEMINI_API_KEY_PROJECT2 }}
        run: |
          python scripts/sovereign_architect_bot.py

      - name: Auto-Commit & Push Sovereign State & Health Validation Sync
        run: |
          git config --global user.name "Sovereign Validated Architect"
          git config --global user.email "validated@sovereign.bot"
          CURRENT_BRANCH=$(git branch --show-current)
          git add .
          git commit -m "👑 [Sovereign Key Health v34.3]: Automatic validation and multi-project intent sync" || true
          git pull origin $CURRENT_BRANCH --rebase --autostash || true
          git push origin $CURRENT_BRANCH
