# ==============================================================================
# AymnGuard Sovereign Enterprise : Sovereign Production & Deployment Pipeline
# ==============================================================================
name: 👑 Sovereign Production & Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sovereign-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Enterprise Dependencies & Verify Integrity
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install google-genai sqlalchemy aiosqlite pydantic fastapi uvicorn

      - name: Execute Sovereign Deployment Shield & Active AI Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          GEMINI_API_KEY_PROJECT2: ${{ secrets.GEMINI_API_KEY_PROJECT2 }}
        run: |
          echo "👑 [SOVEREIGN DEPLOY] : بدء تفعيل وإطلاق محرك الشفاء الذكي والربط الإمبراطوري..."
          python scripts/sovereign_architect_bot.py
