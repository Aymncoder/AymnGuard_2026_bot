# ==============================================================================
# AymnGuard Sovereign Enterprise : Autonomous Architect CI/CD Pipeline
# ==============================================================================
name: 👑 Sovereign Architect & Integrity Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # يتيح لك تشغيل الأداة يدويًا في أي وقت بضغطة زر من واجهة GitHub

jobs:
  sovereign-audit:
    runs-on: ubuntu-latest
    
    steps:
      # 1. سحب أحدث نسخة من المستودع الإمبراطوري
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة تشغيل بايثون القياسية
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # 3. تثبيت التبعيات والحزم المطلوبة للنظام
      - name: Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. إطلاق المهندس السيادي الآلي لفحص المستودع من الألف إلى الياء
      - name: Run Sovereign Architect Audit Agent
        run: |
          python scripts/sovereign_architect_bot.py
