# ==============================================================================
# AymnGuard Enterprise : Ruff Configuration & Quality Constitution (v15.0.0)
# ==============================================================================
# الدستور المركزي للتدقيق البرمجي والأمني:
# يضبط معايير الأداء، يتوافق مع أطر العمل (FastAPI, SQLAlchemy, Alembic)،
# ويحدد بدقة قواعد السماح والتجاهل للحفاظ على استقرار محركات التداول.

target-version = "py311"
line-length = 100

[lint]
# قائمة القواعد والتحذيرات المفعلة
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (متغيرات مفقودة أو غير مستخدمة)
    "I",   # isort (تنظيم وترتيب الاستيرادات)
    "B",   # flake8-bugbear (رصد الثغرات المنطقية الخفية)
    "UP",  # pyupgrade (تحديث أساليب البايثون الحديثة)
    "RUF"  # Ruff-specific rules
]

# قائمة الاستثناءات المدروسة التي يتم تجاهلها بناءً على معمارية النظام (مثل FastAPI و Alembic)
ignore = [
    "B008",  # السماح باستدعاء Depends في القيم الافتراضية لـ FastAPI
    "F401",  # السماح بالاستيرادات الصامتة في ملفات الهجرة (Alembic env.py)
    "DTZ003", # السماح بالتعامل مع التوقيت المرجعي عند الحاجة في سجلات التداول
    "BLE001", # السماح بالتقاط الاستثناءات العامة في دوال الحماية وحلقات الطوارئ لمنع انهيار النظام
    "F841",   # تجاهل التحذيرات المؤقتة للمتغيرات قيد التطوير
    "G201",   # السماح بأنماط تسجيل السجلات المتقدمة
    "TRY201", # السماح بآليات معالجة الأخطاء المرنة
    "RUF012"  # السماح بالقيم الافتراضية القابلة للتعديل في إعدادات المنظومة
]

[lint.per-file-ignores]
# تخصيص قواعد استثناء لملفات معينة إذا لزم الأمر
"alembic/env.py" = ["F401"]
"database/models.py" = ["F401"]
