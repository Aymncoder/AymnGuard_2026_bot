# ==============================================================================
# AymnGuard Enterprise v5.0 - Sovereign Multi-Service Docker Compose Architecture
# مُعدل للعمل حصرياً على البورت السحابي 8000 لضمان الاتصال المباشر والمستقر
# ==============================================================================

version: '3.8'

services:
  # 1. خدمة الذاكرة المؤقتة وموجه الطوابير
  redis:
    image: redis:7-alpine
    container_name: aymnguard_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - aymn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. خادم الويب المركزي (Backend FastAPI Core)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aymnguard-master-node
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///aymnguard_enterprise.db}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SECRET_TOKEN=${TELEGRAM_SECRET_TOKEN:-aymnguard_secure_secret_2026}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - OWNER_ID=${OWNER_ID}
      - APP_ENV=${APP_ENV:-production}
      - PORT=8000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - MINI_APP_URL=${MINI_APP_URL}
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. عامل المهام الخلفية
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aymnguard_worker
    restart: always
    command: python services/worker.py
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///aymnguard_enterprise.db}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  aymn_network:
    driver: bridge
