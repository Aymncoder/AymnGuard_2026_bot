# ==============================================================================
# AymnGuard Enterprise v5.0 - Sovereign Multi-Service Architecture
# ==============================================================================

version: '3.8'

services:
  # 1. Message Broker & Cache Service
  redis:
    image: redis:7-alpine
    container_name: aymnguard_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - aymn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Sovereign Database Service (MongoDB)
  database:
    image: mongo:6.0
    container_name: aymnguard_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: aymnguard_db
    volumes:
      - mongo_data:/data/db
    networks:
      - aymn_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Backend FastAPI Core
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aymnguard-master-node
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///aymnguard_enterprise.db}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SECRET_TOKEN=${TELEGRAM_SECRET_TOKEN:-aymnguard_secure_secret_2026}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - OWNER_ID=${OWNER_ID}
      - APP_ENV=${APP_ENV:-production}
      - PORT=8000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - MINI_APP_URL=${MINI_APP_URL}
    volumes:
      - ./logs:/app/logs
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Background Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aymnguard_worker
    restart: always
    command: python services/worker.py
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///aymnguard_enterprise.db}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=${MONGO_URI}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - ./logs:/app/logs
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  mongo_data:

networks:
  aymn_network:
    driver: bridge
