# ==============================================================================
# AymnGuard Enterprise - Sovereign Docker Compose Architecture (v5.0)
# نظام التنسيق الحاوي المركزي المتوافق مع معمارية النواة و SQLite
# ==============================================================================

version: '3.8'

services:
  # 1. الذاكرة المؤقتة والطوابير (Redis) - لسرعة الاستجابة ومعالجة الأحداث
  redis:
    image: redis:7-alpine
    container_name: aymnguard_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - aymn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. سيرفر الويب المركزي (Backend FastAPI + Mini App Core)
  backend:
    build: 
      context: ./backend_core
      dockerfile: Dockerfile
    container_name: aymnguard_backend
    restart: always
    ports:
      - "10000:10000"
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./aymnguard_enterprise.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SECRET_TOKEN=${TELEGRAM_SECRET_TOKEN:-aymnguard_secure_secret_2026}
      - API_ID=${API_ID:-2040}
      - API_HASH=${API_HASH:-b18441aff607e10a989891a5462e627}
      - OWNER_ID=${OWNER_ID:-5193790077}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=10000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - MINI_APP_URL=${MINI_APP_URL}
    volumes:
      - ./backend_core:/app
      - ./logs:/app/logs
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. عامل طوابير الرسائل الخلفي (Redis Queue Worker) لمعالجة الطلبات المتزامنة
  worker:
    build: 
      context: ./backend_core
      dockerfile: Dockerfile
    container_name: aymnguard_worker
    restart: always
    command: python services/worker.py
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./aymnguard_enterprise.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./backend_core:/app
    networks:
      - aymn_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  aymn_network:
    driver: bridge
