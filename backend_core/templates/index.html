    <!-- سكربت الاتصال اللحظي بالخادم (Sovereign WebSocket Bridge) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const logContainer = document.getElementById("logContainer");
            
            // تنظيف السجلات الثابتة استعداداً لاستقبال الدفق الحي
            logContainer.innerHTML = "[Aegis-AI-Core] - SYSTEM - يتم الآن إنشاء قناة اتصال آمنة ومفرغة (WSS)...<br>";

            // 1. إنشاء الاتصال بالواجهة الخلفية (FastAPI)
            // ملاحظة: سيتم استبدال الرابط برابط السيرفر الفعلي لاحقاً
            const ws = new WebSocket("ws://localhost:8000/api/v1/ws/logs");

            ws.onopen = () => {
                logContainer.innerHTML += "<span style='color: var(--primary);'>[Aegis-AI-Core] - SUCCESS - تم الاتصال بنواة AymnGuard بنجاح.</span><br>";
            };

            // 2. الاستماع للسجلات القادمة من السيرفر
            ws.onmessage = (event) => {
                const logData = event.data;
                const logElement = document.createElement("div");
                
                // تلوين السجلات بناءً على مستوى الخطورة بفضل الذكاء الاصطناعي
                if (logData.includes("ERROR") || logData.includes("CRITICAL")) {
                    logElement.style.color = "var(--danger)";
                } else if (logData.includes("WARNING")) {
                    logElement.style.color = "#ffcc00"; // أصفر للتحذيرات
                } else {
                    logElement.style.color = "var(--text-main)";
                }
                
                logElement.textContent = logData;
                logContainer.appendChild(logElement);
                
                // التمرير التلقائي للأسفل لرؤية أحدث السجلات
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            ws.onclose = () => {
                logContainer.innerHTML += "<span style='color: var(--danger);'>[Aegis-AI-Core] - ALERT - انقطع الاتصال بالنواة المركزية. جاري محاولة إعادة الاتصال...</span><br>";
            };
        });
    </script>
