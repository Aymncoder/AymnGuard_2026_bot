# ==============================================================================
# AymnGuard Enterprise - Sovereign Alembic Configuration File
# ملف إعدادات الترحيل والهندسة العكسية لقاعدة البيانات (Alembic)
# ==============================================================================

[alembic]
# مسار مجلد السكريبتات والهجرات
script_location = alembic

# إضافة المسار الحالي لبيئة العمل لضمان استقرار الاستيرادات
prepend_sys_path = .

# فاصل مسار الإصدارات
version_path_separator = os

# رابط الاتصال بقاعدة البيانات (متوافق مع SQLite المعتمد سيادياً وقابل للتجاوز ديناميكياً عبر env.py)
sqlalchemy.url = sqlite+aiosqlite:///./aymnguard_enterprise.db

[post_write_hooks]
# تنسيق الكود تلقائياً بعد توليد الهجرات (اختياري)
# format = black

# ==============================================================================
# إعدادات السجلات والصناديق السوداء لـ Alembic (Logging Configuration)
# ==============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
