# AymnGuard Enterprise - Alembic Configuration File

[alembic]
# مسار مجلد السكريبتات والهجرات
script_location = alembic

# إضافة المسار الحالي لبيئة العمل
prepend_sys_path = .

# فاصل مسار الإصدارات
version_path_separator = os

# رابط الاتصال الافتراضي بقاعدة البيانات (يتم تعديله ديناميكياً أو برمجياً عبر env.py من متغيرات البيئة)
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@postgres:5432/aymnguard_db


[post_write_hooks]
# إخطارات أو معالجة لاحقة لكود الهجرات إن وجدت (مثل black لتنسيق الكود)


# إعدادات السجلات والتسجيل (Logging Configuration)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

