<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AymnGuard - المنصة اللوجستية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 900: '#0f172a', 500: '#3b82f6', 100: '#f8fafc' } } } }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-brand-100 text-brand-900 font-sans antialiased h-screen flex flex-col overflow-hidden selection:bg-brand-500 selection:text-white">
    <main id="app-root" class="flex-1 flex flex-col w-full max-w-md mx-auto bg-white shadow-2xl relative fade-in">
        <header class="bg-brand-900 text-white p-4 flex justify-between items-center z-10 shadow-md border-b border-gray-800">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">AymnGuard</h1>
                <p class="text-xs text-blue-300 font-medium tracking-wider uppercase">Enterprise Logistics</p>
            </div>
            <div id="connection-status" class="w-3 h-3 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-all duration-500"></div>
        </header>
        <section id="content-area" class="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center relative">
            <div id="loading-screen" class="flex flex-col items-center justify-center space-y-5">
                <div class="w-14 h-14 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
                <p class="text-sm font-bold text-gray-600 animate-pulse">جاري التحقق من الهوية السيادية...</p>
                <p class="text-xs text-gray-400">تأمين الاتصال والمصادقة</p>
            </div>
        </section>
        <footer id="bottom-nav" class="hidden bg-white border-t border-gray-200 flex justify-around p-3 pb-safe z-10"></footer>
    </main>
    
    <!-- تم ربط العقل البرمجي هنا مباشرة وبنجاح -->
    <script src="js/app.js"></script>
</body>
</html>
