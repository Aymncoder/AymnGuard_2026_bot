<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AymnGuard Enterprise - Sovereign Mini App</title>
    <!-- مكتبة تيليجرام الرسمية للويب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 900: '#0f172a', 500: '#3b82f6', 100: '#f8fafc', accent: '#10b981' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-full flex flex-col overflow-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- رأس الصفحة السيادي -->
    <header class="flex items-center justify-between px-6 py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 z-20">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-amber-500 rounded-full shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all duration-300" id="connection-status"></div>
            <span class="text-xs font-extrabold tracking-wider uppercase text-slate-400">AymnGuard Enterprise Core</span>
        </div>
        <span class="text-xs bg-slate-800 text-brand-500 px-3 py-1 rounded-full font-bold border border-slate-700">v5.0 Secure</span>
    </header>

    <!-- مساحة المحتوى الديناميكي -->
    <main id="app-root" class="flex-1 flex flex-col overflow-y-auto p-6 relative">
        <!-- شاشة التحميل الأولية الذكية -->
        <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center space-y-4 animate-fade-in">
            <div class="w-16 h-16 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
            <p class="text-sm font-bold text-slate-300">جاري مزامنة الهوية السيادية والاتصال بالنواة...</p>
            <p class="text-xs text-slate-500">تشفير متقدم وتحقق رقمي فوري</p>
        </div>

        <!-- محتوى لوحة القيادة (يتم حقنه برمجياً) -->
        <div id="content-area" class="w-full max-w-md mx-auto flex flex-col justify-center flex-1"></div>
    </main>

    <!-- شريط التنقل السفلي -->
    <footer id="bottom-nav" class="hidden bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex justify-around p-4 pb-safe z-25">
        <button onclick="window.switchTab('dashboard')" class="flex flex-col items-center text-brand-500 text-xs font-bold gap-1 transition-colors">
            <span>🛡️</span> الرئيسية
        </button>
        <button onclick="window.switchTab('metrics')" class="flex flex-col items-center text-slate-400 text-xs font-bold gap-1 hover:text-white transition-colors">
            <span>📊</span> المؤشرات
        </button>
        <button onclick="window.switchTab('security')" class="flex flex-col items-center text-slate-400 text-xs font-bold gap-1 hover:text-white transition-colors">
            <span>⚙️</span> الحماية
        </button>
    </footer>

    <!-- ربط الملفات البرمجية المعيارية المحدثة -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
